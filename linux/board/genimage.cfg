#
# SD card layout for the RK-ZYNQ7100 (microSD on SD0, boot-mode switch = SD).
#
# Partition 1 (FAT, 0x0C): boot.bin (U-Boot SPL; the BootROM's FAT lookup is
#   case-insensitive, so it is BOOT.BIN to it), u-boot.img, the device tree,
#   the kernel and extlinux.conf, and rkz7100.bin -- the PL bitstream U-Boot
#   loads -- when build.sh was given one (post-image.sh adds it).
# Partition 2 (ext4, 0x83): the root filesystem, root=/dev/mmcblk0p2.

image boot.vfat {
	vfat {
		files = {
			"boot.bin",
			"u-boot.img",
			"system.dtb",
			"uImage"
		}

		file extlinux/extlinux.conf {
			image = extlinux.conf
		}
	}

	size = 32M
}

image sdcard.img {
	hdimage {
	}

	partition boot {
		partition-type = 0xC
		bootable = "true"
		image = "boot.vfat"
	}

	partition rootfs {
		partition-type = 0x83
		image = "rootfs.ext4"
	}
}
