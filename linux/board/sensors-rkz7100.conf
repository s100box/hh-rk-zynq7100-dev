#
# lm-sensors labels for the RK-ZYNQ7100, installed as /etc/sensors.d/rkz7100.conf.
#
# iio-hwmon numbers its inputs in the order the device tree lists them, so
# in1..in6 follow the io-channels list in board/zynq-rkz7100.dts. Without this
# file `sensors` prints six anonymous voltages and there is no way to tell
# which rail sagged.
#
# The rails themselves are in the user guide's power table (section 3); these
# are the six the XADC can see, which are the FPGA's own supplies, not the
# board's 3.3 V or 5 V.

chip "xadc_hwmon-isa-0000"
    label temp1 "XC7Z100 die"

    label in1 "VCCINT (1.0V)"
    label in2 "VCCAUX (1.8V)"
    label in3 "VCCBRAM (1.0V)"
    label in4 "VCCPINT (1.0V)"
    label in5 "VCCPAUX (1.8V)"
    label in6 "VCCO_DDR (1.5V)"

    # The XADC's full scale on these channels is 3 V; a rail more than a few
    # percent off is worth knowing about rather than reading past.
    set in1_min 0.95
    set in1_max 1.05
    set in2_min 1.71
    set in2_max 1.89
    set in3_min 0.95
    set in3_max 1.05
    set in4_min 0.95
    set in4_max 1.05
    set in5_min 1.71
    set in5_max 1.89
    set in6_min 1.43
    set in6_max 1.58

# The fan. `sensors` prints fan1 (rpm, counted by pwm-fan from the tachometer
# interrupt) but not pwm1, which is a setting rather than a reading -- write
# that through /sys/class/hwmon/*/pwm1.
#
# The rpm assumes two tachometer pulses per revolution, which is the device
# tree's guess about the fan rather than anything the board knows. The PL's
# FAN_STATUS register counts raw pulses per second if that needs checking.
chip "pwmfan-*"
    label fan1 "Fan (J10)"
